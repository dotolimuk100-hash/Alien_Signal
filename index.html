<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>엉덩이 교신</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
:root{
  --bg:#ffed6e;
  --dark:#1a0a00;
  --gray:rgba(0,0,0,.18);
}
body{
  background:var(--bg);
  font-family:'Black Han Sans',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  height:100vh;height:100dvh;overflow:hidden;position:relative;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(0,0,0,.05) 1.5px,transparent 1.5px);
  background-size:24px 24px;pointer-events:none;z-index:0;
}

/* ══ TITLE ══ */
#s-title{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:30px;text-align:center;
  transition:opacity .3s;
}
#s-title.hidden{opacity:0;pointer-events:none;}
.title-img{width:min(60vw,240px);object-fit:contain;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.2));
  animation:tFloat 2.5s ease-in-out infinite;}
.title-img-fb{font-size:3.5rem;color:var(--dark);animation:tFloat 2.5s ease-in-out infinite;}
@keyframes tFloat{0%,100%{transform:translateY(0) rotate(-.5deg);}50%{transform:translateY(-14px) rotate(.5deg);}}
.start-sub{font-size:.9rem;color:rgba(0,0,0,.5);font-family:'Nanum Gothic',sans-serif;font-weight:700;line-height:1.8;}
.start-btn{
  background:var(--dark);color:var(--bg);
  border:none;border-radius:16px;padding:18px 48px;
  font-family:'Black Han Sans',sans-serif;font-size:1.5rem;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s,box-shadow .1s;
}
.start-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3);}

/* 음량 버튼 */
.vol-btn{
  position:fixed;top:14px;left:18px;z-index:999;
  font-size:1.6rem;cursor:pointer;
  background:rgba(0,0,0,.1);border-radius:50%;
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
}
.vol-btn:active{background:rgba(0,0,0,.2);}

/* ══ GAME ══ */
#s-game{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#s-game.active{opacity:1;pointer-events:all;}

/* 턴 카운터 */
.turn-counter{
  position:absolute;top:12px;right:18px;z-index:20;
  font-size:3.4rem;color:var(--dark);
  text-shadow:2px 2px 0 rgba(255,255,255,.4);line-height:1;
}
.turn-counter.pop{animation:tPop .2s cubic-bezier(.34,1.56,.64,1);}
@keyframes tPop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

/* 힌트 바 */
.seq-bar{
  position:absolute;top:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;
  z-index:20;
  background:rgba(0,0,0,.12);
  border-radius:30px;
  padding:7px 14px;
  min-width:60px;min-height:30px;
}
.seq-dot{
  width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.25);flex-shrink:0;
  transition:transform .12s;
  border:2px solid rgba(0,0,0,.15);
}
.seq-dot.active{transform:scale(1.5);background:rgba(0,0,0,.6);}
.seq-dot.done{opacity:.3;}

/* ── 교신 외계인 ── */
.alien-section{
  width:100%;
  flex:none;
  height:34vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;padding-top:150px;
}
.alien-wrap{
  position:relative;
  width:min(69vw,270px);
  height:min(69vw,270px);
}
.alien-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.2));
  opacity:0;transition:opacity .05s;
}
.alien-img.show{opacity:1;}

/* ── 플레이어 ── */
.player-section{
  width:100%;
  flex:1;
  position:relative;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:4px;
}
.player-wrap{
  position:relative;
  width:min(88vw,360px);
  height:min(88vw,360px);
}
.player-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.15));
  opacity:0;transition:opacity .05s;
}
.player-img.show{opacity:1;}

/* 터치존 4개 */
.touch-zones{
  position:absolute;
  top:44%;
  bottom:12%;
  left:8%;
  right:8%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  z-index:10;
  gap:4px;
}
.tz{
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.tz-symbol{
  width:44px;height:44px;
  opacity:.4;transition:opacity .1s,transform .1s;
  pointer-events:none;
}
.tz:active .tz-symbol,.tz.pressed .tz-symbol{opacity:.9;transform:scale(1.15);}
.sym-circle{fill:none;stroke:var(--dark);stroke-width:3;}
.sym-triangle{fill:none;stroke:var(--dark);stroke-width:3;}
.sym-square{fill:none;stroke:var(--dark);stroke-width:3;}
.sym-star{fill:var(--dark);}

/* ══ GAME OVER ══ */
#s-over{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:30px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
#s-over.active{opacity:1;pointer-events:all;}
.over-label{font-size:1rem;color:rgba(0,0,0,.5);font-family:'Nanum Gothic',sans-serif;font-weight:700;}
.alien-dance-wrap{width:min(55vw,200px);height:min(55vw,200px);position:relative;}
.alien-dance-img{width:100%;height:100%;object-fit:contain;
  animation:alienDance 0.4s steps(1) infinite;}
@keyframes alienDance{
  0%  {transform:rotate(-15deg) translateY(0);}
  25% {transform:rotate(0deg)   translateY(-10px);}
  50% {transform:rotate(15deg)  translateY(0);}
  75% {transform:rotate(0deg)   translateY(-10px);}
  100%{transform:rotate(-15deg) translateY(0);}
}
.share-btn{
  background:var(--dark);color:var(--bg);
  border:none;border-radius:16px;
  font-family:'Black Han Sans',sans-serif;font-size:1.2rem;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);
  padding:14px;
}
.share-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.over-score{font-size:5.5rem;color:var(--dark);line-height:1;
  animation:sPop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes sPop{0%{transform:scale(0) rotate(-10deg);}100%{transform:scale(1) rotate(0);}}
.over-sub{font-size:1.2rem;color:var(--dark);}

/* 카운트다운 */
#cd-overlay{
  position:absolute;inset:0;z-index:50;
  background:rgba(255,237,110,.93);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#cd-overlay.show{opacity:1;pointer-events:all;}
.cd-big{font-size:10rem;color:var(--dark);line-height:1;
  animation:cdPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes cdPop{0%{transform:scale(0);}100%{transform:scale(1);}}
.cd-hint{font-size:1rem;color:rgba(0,0,0,.4);font-family:'Nanum Gothic',sans-serif;font-weight:700;}

/* Your Turn 느낌표 */
.your-turn-bang{
  position:absolute;
  right:-18px;top:40%;
  font-size:3rem;color:var(--dark);
  font-family:'Black Han Sans',sans-serif;
  opacity:0;pointer-events:none;
  animation:bangPop .4s cubic-bezier(.34,1.56,.64,1) forwards;
  z-index:20;
  text-shadow:2px 2px 0 rgba(255,255,255,.5);
}
@keyframes bangPop{
  0%{opacity:0;transform:scale(0) rotate(-15deg);}
  60%{opacity:1;transform:scale(1.3) rotate(5deg);}
  100%{opacity:1;transform:scale(1) rotate(0);}
}
.your-turn-bang.hide{animation:bangHide .2s ease-in forwards;}
@keyframes bangHide{0%{opacity:1;}100%{opacity:0;}}

/* 실패 플래시 */
#fail-flash{
  position:absolute;inset:0;z-index:40;
  pointer-events:none;background:transparent;transition:background .08s;
}
#fail-flash.on{background:rgba(232,64,28,.35);}
</style>
</head>
<body>

<!-- 음량 버튼 -->
<div class="vol-btn" id="vol-btn" onclick="toggleMute()">🔊</div>

<!-- TITLE -->
<div id="s-title">
  <img class="title-img" src="assets/alien-front.png"
       onerror="this.outerHTML='<div class=\'title-img-fb\'>교신 기억하기</div>'"
       alt="외계인">
  <p class="start-sub">외계인의 신호를 기억하고<br>똑같이 따라 치세요</p>
  <button class="start-btn" onclick="startBGM();initGame()">시작</button>
</div>

<!-- GAME -->
<div id="s-game">
  <div class="turn-counter" id="turn-counter">1</div>
  <div class="seq-bar" id="seq-bar"></div>

  <div class="alien-section">
    <div class="alien-wrap" id="alien-wrap">
      <img class="alien-img show" id="af-front" src="assets/alien-front.png" onerror="this.style.display='none'" alt="">
      <img class="alien-img"      id="af-back"  src="assets/alien-back.png"  onerror="this.style.display='none'" alt="">
      <img class="alien-img"      id="af-tl"    src="assets/alien-tl.png"    onerror="this.style.display='none'" alt="">
      <img class="alien-img"      id="af-bl"    src="assets/alien-bl.png"    onerror="this.style.display='none'" alt="">
      <img class="alien-img"      id="af-tr"    src="assets/alien-tr.png"    onerror="this.style.display='none'" alt="">
      <img class="alien-img"      id="af-br"    src="assets/alien-br.png"    onerror="this.style.display='none'" alt="">
    </div>
  </div>

  <div class="player-section">
    <div class="player-wrap" id="player-wrap">
      <img class="player-img show" id="pf-back" src="assets/player-back.png" onerror="this.style.display='none'" alt="">
      <img class="player-img"      id="pf-tl"   src="assets/player-tl.png"   onerror="this.style.display='none'" alt="">
      <img class="player-img"      id="pf-bl"   src="assets/player-bl.png"   onerror="this.style.display='none'" alt="">
      <img class="player-img"      id="pf-tr"   src="assets/player-tr.png"   onerror="this.style.display='none'" alt="">
      <img class="player-img"      id="pf-br"   src="assets/player-br.png"   onerror="this.style.display='none'" alt="">

      <div class="your-turn-bang" id="bang" style="display:none;">!</div>
      <div class="touch-zones">
        <div class="tz" id="tz-tl" ontouchstart="onInput('tl',event);return false;" onmousedown="onInput('tl',event)">
          <svg class="tz-symbol" viewBox="0 0 36 36"><circle class="sym-circle" cx="18" cy="18" r="12"/></svg>
        </div>
        <div class="tz" id="tz-tr" ontouchstart="onInput('tr',event);return false;" onmousedown="onInput('tr',event)">
          <svg class="tz-symbol" viewBox="0 0 36 36"><polygon class="sym-triangle" points="18,6 30,28 6,28"/></svg>
        </div>
        <div class="tz" id="tz-bl" ontouchstart="onInput('bl',event);return false;" onmousedown="onInput('bl',event)">
          <svg class="tz-symbol" viewBox="0 0 36 36"><rect class="sym-square" x="8" y="8" width="20" height="20"/></svg>
        </div>
        <div class="tz" id="tz-br" ontouchstart="onInput('br',event);return false;" onmousedown="onInput('br',event)">
          <svg class="tz-symbol" viewBox="0 0 36 36">
            <polygon class="sym-star" points="18,4 21.5,14 32,14 23.5,20.5 26.5,31 18,25 9.5,31 12.5,20.5 4,14 14.5,14"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="s-over">
  <div class="alien-dance-wrap">
    <img class="alien-dance-img" id="dance-img" src="assets/alien-front.png"
         onerror="this.style.fontSize='80px';this.src='';this.alt='👽';this.removeAttribute('onerror')" alt="">
  </div>
  <div class="over-label">기억한 턴 수</div>
  <div class="over-score" id="over-score">0</div>
  <div class="over-sub" id="over-sub"></div>
  <div style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;">
    <button class="share-btn" onclick="shareResult()" style="width:200px;">𝕏 공유하기</button>
    <button class="start-btn" onclick="goHome()" style="font-size:1.2rem;width:200px;">다시 하기</button>
  </div>
</div>

<div id="cd-overlay">
  <div class="cd-big" id="cd-num">3</div>
  <div class="cd-hint">잘 봐!</div>
</div>
<div id="fail-flash"></div>

<script>
'use strict';

const INPUTS = ['tl','tr','bl','br'];
const ALIEN_FRAME = { front:'af-front', back:'af-back', tl:'af-tl', bl:'af-bl', tr:'af-tr', br:'af-br' };
const PLAYER_FRAME = { back:'pf-back', tl:'pf-tl', bl:'pf-bl', tr:'pf-tr', br:'pf-br' };

// ══ Web Audio: 게임 효과음 ══
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playNoise(ctx, startAt, dur, vol, freqLow, freqHigh) {
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2);
  const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  src.buffer = buf; f.type = 'bandpass';
  f.frequency.value = (freqLow+freqHigh)/2; f.Q.value = 1.2;
  g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(startAt);
}
function soundTL(v=1){const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(160,now);o.frequency.exponentialRampToValueAtTime(50,now+.18);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+.005);g.gain.exponentialRampToValueAtTime(.001,now+.35);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.4);playNoise(audioCtx,now,.12,v*.5,80,300);}
function soundBL(v=1){const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(260,now);o.frequency.exponentialRampToValueAtTime(90,now+.12);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v*.8,now+.005);g.gain.exponentialRampToValueAtTime(.001,now+.25);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.3);playNoise(audioCtx,now,.1,v*.6,200,600);}
function soundTR(v=1){const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(900,now);o.frequency.exponentialRampToValueAtTime(350,now+.06);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v*.55,now+.003);g.gain.exponentialRampToValueAtTime(.001,now+.12);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.14);playNoise(audioCtx,now,.07,v*.7,600,1200);}
function soundBR(v=1){playNoise(audioCtx,audioCtx.currentTime,.08,v*.9,1000,4000);const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=1400;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v*.3,now+.002);g.gain.exponentialRampToValueAtTime(.001,now+.06);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.07);}
function playSound(input,vol=1){ensureAudio();if(input==='tl')soundTL(vol);else if(input==='bl')soundBL(vol);else if(input==='tr')soundTR(vol);else if(input==='br')soundBR(vol);}
function playFail(){ensureAudio();const now=audioCtx.currentTime;[0,.15,.3].forEach((off,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=200-i*35;g.gain.setValueAtTime(.3,now+off);g.gain.exponentialRampToValueAtTime(.001,now+off+.12);o.connect(g);g.connect(audioCtx.destination);o.start(now+off);o.stop(now+off+.14);});}

// ══ BGM ══
let bgmCtx = null, bgmGain = null, bgmMuted = false, bgmStarted = false;

function startBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  if (!bgmCtx) bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (bgmCtx.state === 'suspended') bgmCtx.resume();
  bgmGain = bgmCtx.createGain();
  bgmGain.gain.value = 0.18;
  bgmGain.connect(bgmCtx.destination);
  scheduleBGMLoop(bgmCtx.currentTime);
}

const BGM_BEAT = 60 / 128; // BPM 128
const BGM_LOOP = BGM_BEAT * 16; // 4마디

function bgmOsc(freq, type, t, dur, vol, pitchEnd) {
  const o = bgmCtx.createOscillator(), g = bgmCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (pitchEnd) o.frequency.exponentialRampToValueAtTime(pitchEnd, t + dur * 0.8);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t + dur + 0.02);
}
function bgmNz(t, dur, vol, lo, hi) { playNoise(bgmCtx, t, dur, vol, lo, hi); }

function playBGMLoop(t) {
  const B = BGM_BEAT;
  for (let bar = 0; bar < 4; bar++) {
    const b = t + bar * B * 4;
    // 킥 (1,3박)
    [0,2].forEach(i=>{ bgmOsc(160,'sine',b+i*B,0.22,0.45,50); bgmNz(b+i*B,0.08,0.28,80,300); });
    // 스네어 (2,4박)
    [1,3].forEach(i=>{ bgmOsc(200,'triangle',b+i*B,0.14,0.28,100); bgmNz(b+i*B,0.1,0.35,200,800); });
    // 하이햇
    for (let i=0;i<8;i++) bgmNz(b+i*B*0.5, 0.04, 0.12, 4000, 12000);
    // 베이스
    [130.81,130.81,164.81,130.81].forEach((f,i)=>bgmOsc(f,'sine',b+i*B,B*0.7,0.3));
    // 멜로디
    const mel = bar%2===0
      ? [[523.25,0],[659.25,0.5],[783.99,1],[659.25,1.5],[880,2],[783.99,2.5],[659.25,3],[523.25,3.5]]
      : [[587.33,0],[698.46,0.5],[880,1],[698.46,1.5],[587.33,2],[523.25,2.5],[440,3],[392,3.5]];
    mel.forEach(([f,bt])=>bgmOsc(f,'triangle',b+bt*B,B*0.32,0.1));
    // 아르페지오
    [1046.5,1318.5,1567.98,1046.5,1318.5,1046.5,1318.5,1567.98].forEach((f,i)=>
      bgmOsc(f,'sine',b+i*B*0.25,B*0.18,0.055));
  }
}

function scheduleBGMLoop(startAt) {
  if (!bgmStarted) return;
  playBGMLoop(startAt);
  const delay = (startAt + BGM_LOOP - bgmCtx.currentTime) * 1000 - 200;
  setTimeout(() => scheduleBGMLoop(startAt + BGM_LOOP), Math.max(0, delay));
}

function toggleMute() {
  bgmMuted = !bgmMuted;
  if (bgmGain) bgmGain.gain.setTargetAtTime(bgmMuted ? 0 : 0.18, bgmCtx.currentTime, 0.1);
  document.getElementById('vol-btn').textContent = bgmMuted ? '🔇' : '🔊';
}

// ══ 느낌표 ══
let bangTimer = null;
function showBang(){const b=document.getElementById('bang');if(!b)return;b.style.display='block';b.classList.remove('hide');b.style.animation='none';void b.offsetWidth;b.style.animation='bangPop .4s cubic-bezier(.34,1.56,.64,1) forwards';clearTimeout(bangTimer);bangTimer=setTimeout(()=>hideBang(),1000);}
function hideBang(){const b=document.getElementById('bang');if(!b)return;b.classList.add('hide');setTimeout(()=>{b.style.display='none';b.classList.remove('hide');},200);}

// ══ 게임 상태 ══
let sequence=[], inputIdx=0, canInput=false, isShowing=false, turn=0;
let alienTimer=null, playerTimer=null;

const sTitle=document.getElementById('s-title');
const sGame=document.getElementById('s-game');
const sOver=document.getElementById('s-over');
const cdOv=document.getElementById('cd-overlay');
const cdNum=document.getElementById('cd-num');
const turnEl=document.getElementById('turn-counter');
const seqBar=document.getElementById('seq-bar');
const failFl=document.getElementById('fail-flash');

function setAlien(frame){Object.values(ALIEN_FRAME).forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('show');});const t=document.getElementById(ALIEN_FRAME[frame]||ALIEN_FRAME.front);if(t)t.classList.add('show');}
function setPlayer(frame){Object.values(PLAYER_FRAME).forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('show');});const t=document.getElementById(PLAYER_FRAME[frame]||PLAYER_FRAME.back);if(t)t.classList.add('show');}

function initGame() {
  ensureAudio();
  stopDance();
  sequence=[]; inputIdx=0; turn=0; canInput=false; isShowing=false;
  seqBar.innerHTML='';
  setAlien('front'); setPlayer('back');
  sTitle.classList.add('hidden');
  sGame.classList.add('active');
  sOver.classList.remove('active');
  cdOv.classList.add('show');
  let cd=3; cdNum.textContent=cd;
  cdNum.style.animation='none'; void cdNum.offsetWidth; cdNum.style.animation='cdPop .35s cubic-bezier(.34,1.56,.64,1)';
  const ci=setInterval(()=>{
    cd--;
    if(cd>0){cdNum.textContent=cd;cdNum.style.animation='none';void cdNum.offsetWidth;cdNum.style.animation='cdPop .35s cubic-bezier(.34,1.56,.64,1)';}
    else{clearInterval(ci);cdOv.classList.remove('show');nextTurn();}
  },900);
}

// ══ 속도: 20개 이후 매 턴마다 가속 ══
function getSpeed(){
  if(turn<=5)  return 550;
  if(turn<=10) return 420;
  if(turn<=15) return 310;
  if(turn<=20) return 220;
  return Math.max(80, 220-(turn-20)*10);
}
function getGap(){
  if(turn<=5)  return 300;
  if(turn<=10) return 220;
  if(turn<=15) return 160;
  if(turn<=20) return 110;
  return Math.max(50, 110-(turn-20)*6);
}

function nextTurn() {
  turn++;
  turnEl.textContent=turn;
  turnEl.classList.remove('pop'); void turnEl.offsetWidth; turnEl.classList.add('pop');

  // 20개 제한: 이후엔 추가 없이 속도만 증가
  if (sequence.length < 20) {
    let next, last=sequence[sequence.length-1], sl=sequence[sequence.length-2], att=0;
    do { next=INPUTS[Math.floor(Math.random()*4)]; att++; }
    while(att<10 && next===last && next===sl);
    sequence.push(next);
  }
  inputIdx=0; canInput=false;

  seqBar.innerHTML='';
  sequence.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='seq-dot'; d.id='dot-'+i;
    seqBar.appendChild(d);
  });

  setAlien('front');
  setTimeout(()=>showSequence(), 500);
}

function showSequence() {
  isShowing=true; canInput=false;
  const speed=getSpeed(), gap=getGap();
  setAlien('back');
  setTimeout(()=>{
    let i=0;
    function showNext(){
      if(i>=sequence.length){
        isShowing=false; canInput=true;
        setAlien('front'); showBang(); return;
      }
      const inp=sequence[i];
      const dot=document.getElementById('dot-'+i);
      if(dot) dot.classList.add('active');
      setAlien(inp); playSound(inp,0.5);
      setTimeout(()=>{
        if(dot){dot.classList.remove('active');dot.classList.add('done');}
        setAlien('back'); i++;
        setTimeout(showNext,gap);
      },speed);
    }
    showNext();
  },350);
}

function onInput(inp,e){
  if(e){e.preventDefault();e.stopPropagation();}
  ensureAudio();
  hideBang(); clearTimeout(bangTimer);
  const tzEl=document.getElementById('tz-'+inp);
  if(tzEl){tzEl.classList.add('pressed');setTimeout(()=>tzEl.classList.remove('pressed'),150);}
  clearTimeout(playerTimer);
  setPlayer(inp);
  playerTimer=setTimeout(()=>setPlayer('back'),220);
  playSound(inp,1.0);
  if(!canInput||isShowing) return;

  // 히스토리: seq-dot에 색깔 심볼 덮어씌우기
  (function(){
    const dot=document.querySelectorAll('#seq-bar .seq-dot')[inputIdx];
    if(!dot) return;
    const colors={tl:'#CC2200',tr:'#1133CC',bl:'#CC5500',br:'#117733'};
    const svgs={
      tl:`<svg viewBox="0 0 36 36" style="width:100%;height:100%;"><circle fill="none" stroke="${colors.tl}" stroke-width="4" cx="18" cy="18" r="11"/></svg>`,
      tr:`<svg viewBox="0 0 36 36" style="width:100%;height:100%;"><polygon fill="none" stroke="${colors.tr}" stroke-width="4" points="18,7 29,27 7,27"/></svg>`,
      bl:`<svg viewBox="0 0 36 36" style="width:100%;height:100%;"><rect fill="none" stroke="${colors.bl}" stroke-width="4" x="9" y="9" width="18" height="18"/></svg>`,
      br:`<svg viewBox="0 0 36 36" style="width:100%;height:100%;"><polygon fill="${colors.br}" points="18,4 21.5,14 32,14 23.5,20.5 26.5,31 18,25 9.5,31 12.5,20.5 4,14 14.5,14"/></svg>`,
    };
    dot.innerHTML=svgs[inp];
    dot.style.background='transparent'; dot.style.border='none';
    dot.style.opacity=sequence[inputIdx]===inp?'1':'0.3';
    dot.style.transform='scale(1.2)';
  })();

  if(sequence[inputIdx]===inp){
    inputIdx++;
    if(inputIdx>=sequence.length){canInput=false;setTimeout(()=>nextTurn(),700);}
  } else {
    canInput=false; playFail();
    failFl.classList.add('on'); setTimeout(()=>failFl.classList.remove('on'),200);
    setTimeout(()=>{
      sGame.classList.remove('active'); sOver.classList.add('active');
      document.getElementById('over-score').textContent=turn-1;
      startDance();
      const n=turn-1;
      document.getElementById('over-sub').textContent=
        n>=15?'외계인이 경악했어요!':n>=10?'놀라운 기억력!':n>=5?'꽤 잘 기억했어요!':'더 연습해봐요!';
    },700);
  }
}

document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='KeyQ')onInput('tl',null);
  if(e.code==='KeyW')onInput('tr',null);
  if(e.code==='KeyA')onInput('bl',null);
  if(e.code==='KeyS')onInput('br',null);
});

// ══ 댄스 ══
let danceFrames=['assets/alien-tl.png','assets/alien-bl.png','assets/alien-tr.png','assets/alien-br.png'];
let danceIdx=0, danceTimer=null;
function startDance(){clearInterval(danceTimer);danceIdx=0;danceTimer=setInterval(()=>{danceIdx=(danceIdx+1)%danceFrames.length;const img=document.getElementById('dance-img');if(img&&img.tagName==='IMG')img.src=danceFrames[danceIdx];},200);}
function stopDance(){clearInterval(danceTimer);danceTimer=null;}

function goHome(){
  stopDance();
  sequence=[]; inputIdx=0; turn=0; canInput=false; isShowing=false;
  sOver.classList.remove('active');
  sTitle.classList.remove('hidden');
  const img=document.getElementById('dance-img');
  if(img&&img.tagName==='IMG') img.src='assets/alien-front.png';
}

function shareResult(){
  const score=document.getElementById('over-score').textContent;
  const text=`외계인이랑 엉덩이로 교신했어요 🛸\n${score}턴 기억 성공!\n\n#엉덩이교신`;
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`,'_blank');
}
</script>
